# Per-org manual-only workflow. Owner reports this org available; no cross-org quota inheritance.
name: CI/CD Full Flow — Manual Bootstrap Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert checked-out SHA matches workflow SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Org-aware quota and repository preflight (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .cicd/org_quota.py --org leminhphap-improvement --repo practices --require-available
      - name: Verify non-production public-safe bootstrap
        run: python3 .cicd/verify.py
