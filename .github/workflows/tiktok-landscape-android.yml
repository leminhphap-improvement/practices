name: TikTok Landscape Android APK

on:
  push:
    branches:
      - feat/add-fullscreen-tiktok-auto-scroll-video
    paths:
      - 'android/tiktok-landscape-assistant/**'
      - '.github/workflows/tiktok-landscape-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/tiktok-landscape-assistant
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run pure Java logic tests
        run: sh verification/test-end-detector.sh
      - name: Assemble installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -tq "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='dev.lyonpro.tiktoklandscape'"
          mkdir -p dist
          cp "$apk" dist/TikTokLandscapeAssistant-v0.1.0-alpha.apk
          (cd dist && sha256sum TikTokLandscapeAssistant-v0.1.0-alpha.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-landscape-assistant-debug-apk
          path: android/tiktok-landscape-assistant/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental pre-release on explicit release commit
        if: success() && startsWith(github.event.head_commit.message, 'release(android):')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/TikTokLandscapeAssistant-v0.1.0-alpha.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "TikTok Landscape Assistant $tag (Experimental)" \
            --prerelease \
            --notes "Personal experimental Android debug APK. Auto Next depends on TikTok exposing accessibility controls; correct episode order and last-episode detection are NOT verified. Accessibility and Modify system settings permissions are required. Portrait is intentionally untouched. No guarantee about TikTok third-party automation restrictions."
      - name: Publish exact-SHA result to GitHub Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'tiktok-landscape-android-apk',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `APK build ${state}; GitHub Actions run ${context.runId}`
            });
