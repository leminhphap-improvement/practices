name: TikTok Landscape Android APK

on:
  push:
    branches:
      - feat/add-fullscreen-tiktok-auto-scroll-video
    paths:
      - 'android/tiktok-landscape-assistant/**'
      - '.github/workflows/tiktok-landscape-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/tiktok-landscape-assistant
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify or install Android SDK packages
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "SDK: $ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Run pure Java logic tests
        run: sh verification/test-end-detector.sh
      - name: Assemble Auto Next and Brightness Lite debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :lite:assembleDebug
      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          full='app/build/outputs/apk/debug/app-debug.apk'
          lite='lite/build/outputs/apk/debug/lite-debug.apk'
          for apk in "$full" "$lite"; do
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$full" | grep "package: name='dev.lyonpro.tiktoklandscape'"
          "$aapt" dump badging "$lite" | grep "package: name='dev.lyonpro.tiktoklandscape.lite'"
          # Compile-time assertion: the safe Lite build declares no AccessibilityService, SMS, or Internet access.
          if "$aapt" dump xmltree "$lite" AndroidManifest.xml | grep -E 'BIND_ACCESSIBILITY_SERVICE|accessibilityservice|READ_SMS|RECEIVE_SMS|android.permission.INTERNET'; then
            echo 'ERROR: Lite declares forbidden high-risk permission or Accessibility service.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$full" dist/TikTokLandscapeAssistant-Full-v0.2.0-alpha.apk
          cp "$lite" dist/LandscapeBrightnessLite-v0.2.0-alpha.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: landscape-assistant-full-and-lite-apks
          path: android/tiktok-landscape-assistant/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental pre-release on explicit release commit
        if: success() && startsWith(github.event.head_commit.message, 'release(android):')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/TikTokLandscapeAssistant-Full-v0.2.0-alpha.apk dist/LandscapeBrightnessLite-v0.2.0-alpha.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Landscape Assistant $tag (Security update, Experimental)" \
            --prerelease \
            --notes "TWO DIFFERENT APPS: Lite only provides a user-triggered Quick Settings 100% brightness toggle, with no Accessibility/Auto Next/TikTok inspection. Full attempts TikTok landscape Auto Next using sensitive Accessibility; Google Play Protect may BLOCK sideloading it, especially in Vietnam. DO NOT disable Play Protect. Full now includes prominent disclosure, affirmative consent, and TikTok package scoping. Neither app has been tested on the user's device. Brightness Lite may still be scanned or warned about by the installer. A future Full distribution should pursue official Play Console review or Google Play Protect appeal; no protection bypass. The Full app does not guarantee correct Next Episode or stop at series end."
      - name: Publish exact-SHA result to GitHub Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'tiktok-landscape-android-apk',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `APK build ${state}; GitHub Actions run ${context.runId}`
            });
