name: TikTok Landscape Android APK

on:
  push:
    branches:
      - feat/add-fullscreen-tiktok-auto-scroll-video
    paths:
      - 'android/tiktok-landscape-assistant/**'
      - '.github/workflows/tiktok-landscape-android.yml'
  workflow_dispatch:

concurrency:
  group: landscape-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/tiktok-landscape-assistant
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify or install Android SDK packages
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "SDK: $ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Run pure Java logic tests
        run: sh verification/test-end-detector.sh
      - name: Assemble Full + Lite APKs and Full unsigned Play test bundle
        run: gradle --no-daemon --stacktrace :app:assembleDebug :lite:assembleDebug :app:bundleRelease
      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          full='app/build/outputs/apk/debug/app-debug.apk'
          lite='lite/build/outputs/apk/debug/lite-debug.apk'
          bundle='app/build/outputs/bundle/release/app-release.aab'
          test -s "$bundle"
          unzip -tq "$bundle" >/dev/null
          for apk in "$full" "$lite"; do
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$full" | grep "package: name='dev.lyonpro.tiktoklandscape'"
          "$aapt" dump badging "$lite" | grep "package: name='dev.lyonpro.tiktoklandscape.lite'"
          # Compile-time assertion: the safe Lite build declares no AccessibilityService, SMS, or Internet access.
          if "$aapt" dump xmltree "$lite" AndroidManifest.xml | grep -E 'BIND_ACCESSIBILITY_SERVICE|accessibilityservice|READ_SMS|RECEIVE_SMS|android.permission.INTERNET'; then
            echo 'ERROR: Lite declares forbidden high-risk permission or Accessibility service.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$full" dist/TikTokLandscapeAssistant-Full-v0.3.0-alpha.apk
          cp "$lite" dist/LandscapeBrightnessLite-v0.2.0-alpha.apk
          cp "$bundle" dist/TikTokLandscapeAssistant-Full-v0.3.0-alpha-unsigned.aab
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: landscape-assistant-full-and-lite-apks
          path: android/tiktok-landscape-assistant/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental pre-release on explicit release commit
        if: success() && startsWith(github.event.head_commit.message, 'release(android):')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/TikTokLandscapeAssistant-Full-v0.3.0-alpha.apk dist/LandscapeBrightnessLite-v0.2.0-alpha.apk dist/TikTokLandscapeAssistant-Full-v0.3.0-alpha-unsigned.aab dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Landscape Assistant $tag (Episode diagnostics, Experimental)" \
            --prerelease \
            --notes "Experimental. Brightness Lite v0.2.0 has NO Accessibility/Auto Next (previous manual brightness function was verified on a user device). Full v0.3.0 has new deterministic next-episode policy, explicit episode counter stop guard, privacy-safe diagnostics and user-triggered Next Episode Quick Settings tile. Full requires Accessibility; it may be blocked by Google Play Protect when sideloaded. DO NOT disable Play Protect; use an officially reviewed/tested distribution path. The AAB is UNSIGNED and NOT directly installable; signing and Play Console account are owner-only steps. No real-device Auto Next acceptance yet. See E2E_TEST_VI.md, PLAY_CONSOLE_HANDOFF_VI.md and PRIVACY_POLICY.md on the feature branch."
      - name: Publish exact-SHA result to GitHub Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'tiktok-landscape-android-apk',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `APK build ${state}; GitHub Actions run ${context.runId}`
            });
